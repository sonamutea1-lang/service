<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-emerald-100">

      <div class="flex items-center space-x-2">
        <span class="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow-xs">
          <i class="fa-solid fa-shield-virus"></i>
        </span>
        <div>
          <h1 class="text-sm font-bold text-slate-900 leading-tight">2026 감염병 대응 모의훈련</h1>
          <p class="text-[11px] text-slate-500 font-medium">인플루엔자(독감) 대응 및 평가</p>
        </div>
      </div>

          이해도퀴즈
        </button>
      </div>
    </div>

      <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
        <button onclick="switchStep(1)" id="tab-btn-1" class="py-2.5 px-1 rounded-xl text-xs font-bold transition text-center shadow-xs bg-emerald-600 text-white">
          <span class="block text-[10px] font-normal opacity-85">10.19(발생)</span>
          1단계
        </button>
        <button onclick="switchStep(2)" id="tab-btn-2" class="py-2.5 px-1 rounded-xl text-xs font-bold transition text-center bg-white text-slate-500 border border-slate-200">
          <span class="block text-[10px] font-normal text-slate-400">10.20(확진)</span>
          2단계
        </button>
        <button onclick="switchStep(3)" id="tab-btn-3" class="py-2.5 px-1 rounded-xl text-xs font-bold transition text-center bg-white text-slate-500 border border-slate-200">
          <span class="block text-[10px] font-normal text-slate-400">10.21~(유행)</span>
          3단계
        </button>
      </div>
    </div>

    <main class="flex-grow max-w-md mx-auto w-full px-4 pt-3 pb-24 space-y-4">
      <div id="step-container" class="space-y-4"></div>
    </main>

    <!-- Bottom Action Bar for Training -->
    <footer class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-3">
      <div class="max-w-md mx-auto flex items-center justify-between space-x-2">
        <button onclick="prevStep()" id="prev-btn" class="w-1/3 py-3 rounded-xl border border-slate-300 font-semibold text-slate-600 text-xs hover:bg-slate-50 active:scale-95 transition disabled:opacity-30 disabled:pointer-events-none">
          <i class="fa-solid fa-chevron-left mr-1"></i>이전
        </button>
        <button onclick="nextStep()" id="next-btn" class="w-2/3 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md active:scale-95 transition flex items-center justify-center space-x-1.5">
          <span>다음 단계 이동</span>
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </footer>
  </div>

        </div>
      </div>

    </div>

        renderTraining();
      } else {
        tView.classList.add('hidden');
        qView.classList.remove('hidden');
        btnQuiz.className = "px-2.5 py-1 rounded-lg bg-white text-emerald-700 shadow-xs transition";
        btnTraining.className = "px-2.5 py-1 rounded-lg text-slate-500 hover:text-slate-800 transition";
        renderQuiz();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // -------------------------------------------------------------
    // Training Renderer
    // -------------------------------------------------------------
    function renderTraining() {
      const data = stepData[currentStep];

      // Update Top Step Tabs
      for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById(`tab-btn-${i}`);
        if (i === currentStep) {
          btn.className = "py-2.5 px-1 rounded-xl text-xs font-bold transition text-center shadow-xs bg-emerald-600 text-white";
        } else if (i < currentStep) {
          btn.className = "py-2.5 px-1 rounded-xl text-xs font-bold transition text-center bg-emerald-50 text-emerald-700 border border-emerald-200";
        } else {
          btn.className = "py-2.5 px-1 rounded-xl text-xs font-bold transition text-center bg-white text-slate-500 border border-slate-200";
        }
      }

      // Build HTML
      let html = `
        <!-- Scenario Summary Card -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold text-slate-900">${data.title}</span>
            <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full border ${data.badgeColor}">${data.date}</span>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed bg-slate-50 p-2.5 rounded-xl border border-slate-100">
            ${data.scenario}
          </p>
        </div>

        <!-- Role Checklist Section -->
        <div>
          <div class="flex items-center justify-between mb-2 px-1">
            <span class="text-xs font-bold text-slate-700">
              <i class="fa-solid fa-clipboard-check text-emerald-600 mr-1"></i>직군별 역할 체크리스트
            </span>
            <span class="text-[10px] text-slate-400">터치하여 확인 체크</span>
          </div>
          <div class="space-y-2.5">
      `;

      data.roles.forEach((r) => {
        html += `
          <div class="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-xs">
            <div class="flex items-center space-x-2 mb-2 font-bold text-xs ${r.color}">
              <i class="fa-solid ${r.icon}"></i>
              <span>${r.title}</span>
            </div>
            <div class="space-y-2">
              ${r.tasks.map((task, tIdx) => {
                const checkId = `${r.key}_${tIdx}`;
                const isChecked = checkedMap[checkId] ? 'checked' : '';
                return `
                  <label class="flex items-start space-x-2 text-xs text-slate-700 cursor-pointer active:opacity-75">
                    <input type="checkbox" id="${checkId}" onchange="toggleTask('${checkId}')" ${isChecked}
                           class="mt-0.5 rounded text-emerald-600 focus:ring-emerald-500 h-4 w-4 border-slate-300">
                    <span class="leading-relaxed ${isChecked ? 'line-through text-slate-400' : ''}">${task}</span>
                  </label>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      html += `
          </div>
        </div>

        <!-- Essential Q&A Section -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs">
          <div class="text-xs font-bold text-slate-800 mb-2 flex items-center space-x-1.5">
            <i class="fa-regular fa-lightbulb text-amber-500 text-sm"></i>
            <span>${currentStep}단계 핵심 수칙 Q&A</span>
          </div>
          <div class="space-y-2">
            ${data.qa.map((qaItem) => `
              <div class="bg-amber-50/60 rounded-xl p-3 border border-amber-100 text-xs space-y-1">
                <div class="font-bold text-amber-900 flex items-start space-x-1">
                  <span class="text-amber-600 font-extrabold">Q.</span>
                  <span>${qaItem.q}</span>
                </div>
                <div class="text-slate-600 pl-4 leading-relaxed text-[11.5px]">
                  ${qaItem.a}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      document.getElementById('step-container').innerHTML = html;

      // Bottom Button Control
      document.getElementById('prev-btn').disabled = (currentStep === 1);
      const nextBtn = document.getElementById('next-btn');
      if (currentStep === 3) {
        nextBtn.innerHTML = `<span>모의훈련 완료 (퀴즈 풀기)</span> <i class="fa-solid fa-check ml-1"></i>`;
        nextBtn.className = "w-2/3 py-3 rounded-xl bg-slate-900 hover:bg-black text-white font-bold text-xs shadow-md active:scale-95 transition flex items-center justify-center space-x-1.5";
      } else {
        nextBtn.innerHTML = `<span>다음 단계 이동</span> <i class="fa-solid fa-chevron-right ml-1"></i>`;
        nextBtn.className = "w-2/3 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md active:scale-95 transition flex items-center justify-center space-x-1.5";
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleTask(checkId) {
      const checkbox = document.getElementById(checkId);
      if (checkbox.checked) {
        checkedMap[checkId] = true;
      } else {
        delete checkedMap[checkId];
      }
      sessionStorage.setItem('flu_check_list', JSON.stringify(checkedMap));
      renderTraining();
    }

    function switchStep(step) {
      currentStep = step;
      renderTraining();
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        renderTraining();
      }
    }

    function nextStep() {
      if (currentStep < 3) {
        currentStep++;
        renderTraining();
      } else {
        document.getElementById('cert-modal').classList.remove('hidden');
      }
    }

    function closeModal() {
      document.getElementById('cert-modal').classList.add('hidden');
    }

    function goToQuizFromModal() {
      closeModal();
      setMainView('quiz');
    }

    // -------------------------------------------------------------
    // Quiz Renderer & Logic
    // -------------------------------------------------------------
    function renderQuiz() {
      const total = quizQuestions.length;
      const q = quizQuestions[currentQuizIndex];
      const selected = selectedQuizAnswers[currentQuizIndex];
      const hasAnswered = selected !== undefined;

      // Update progress
      document.getElementById('quiz-progress-text').textContent = `문제 ${currentQuizIndex + 1} / ${total}`;
      const pct = ((currentQuizIndex + 1) / total) * 100;
      document.getElementById('quiz-progress-bar').style.width = `${pct}%`;

      let html = `
        <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-4">
          <!-- Question Header -->
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
              ${q.stepBadge} 연계
            </span>
            <span class="text-xs font-semibold text-slate-400">문항 ${q.id}</span>
          </div>

          <!-- Question Text -->
          <h3 class="text-sm font-bold text-slate-900 leading-snug">
            ${q.question}
          </h3>

          <!-- Options List -->
          <div class="space-y-2 pt-1">
      `;

      q.options.forEach((opt, idx) => {
        let btnStyle = "w-full text-left p-3.5 rounded-2xl border text-xs font-medium transition flex items-start space-x-2.5 ";
        let badgeStyle = "w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5 ";

        if (!hasAnswered) {
          btnStyle += "bg-white border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/30 text-slate-700 active:scale-[0.99]";
          badgeStyle += "bg-slate-100 text-slate-500 border border-slate-200";
        } else {
          // If answered, reveal immediate feedback
          if (idx === q.correct) {
            btnStyle += "bg-emerald-50 border-emerald-500 text-emerald-950 font-semibold ring-1 ring-emerald-500";
            badgeStyle += "bg-emerald-600 text-white";
          } else if (idx === selected) {
            btnStyle += "bg-rose-50 border-rose-300 text-rose-900 font-medium";
            badgeStyle += "bg-rose-500 text-white";
          } else {
            btnStyle += "bg-white border-slate-200 opacity-45 text-slate-500";
            badgeStyle += "bg-slate-100 text-slate-400";
          }
        }

        html += `
          <button onclick="handleOptionSelect(${idx})" ${hasAnswered ? 'disabled' : ''} class="${btnStyle}">
            <span class="${badgeStyle}">${idx + 1}</span>
            <span class="leading-relaxed flex-grow">${opt}</span>
            ${hasAnswered && idx === q.correct ? '<i class="fa-solid fa-circle-check text-emerald-600 ml-1 mt-0.5 text-sm"></i>' : ''}
            ${hasAnswered && idx === selected && idx !== q.correct ? '<i class="fa-solid fa-circle-xmark text-rose-500 ml-1 mt-0.5 text-sm"></i>' : ''}
          </button>
        `;
      });

      html += `</div>`;

      // Feedback & Explanation Box
      if (hasAnswered) {
        const isRight = selected === q.correct;
        html += `
          <div class="mt-4 p-3.5 rounded-2xl text-xs space-y-1.5 ${isRight ? 'bg-emerald-50/80 border border-emerald-200' : 'bg-rose-50/80 border border-rose-200'}">
            <div class="font-bold flex items-center space-x-1.5 ${isRight ? 'text-emerald-800' : 'text-rose-800'}">
              <i class="fa-solid ${isRight ? 'fa-check-circle' : 'fa-triangle-exclamation'}"></i>
              <span>${isRight ? '정답입니다!' : '오답입니다. 해설을 확인해 보세요.'}</span>
            </div>
            <p class="text-slate-600 pl-4 leading-relaxed text-[11.5px]">
              ${q.explanation}
            </p>
          </div>
        `;
      }

      // Quiz Navigation Buttons
      html += `
        <div class="flex items-center justify-between pt-2 space-x-2">
          <button onclick="prevQuiz()" ${currentQuizIndex === 0 ? 'disabled' : ''} class="w-1/3 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-30 disabled:pointer-events-none transition">
            <i class="fa-solid fa-chevron-left mr-1"></i>이전 문항
          </button>
      `;

      if (currentQuizIndex === total - 1) {
        html += `
          <button onclick="finishQuiz()" ${!hasAnswered ? 'disabled' : ''} class="w-2/3 py-2.5 rounded-xl bg-slate-900 hover:bg-black text-white text-xs font-bold shadow-md disabled:opacity-40 disabled:pointer-events-none transition flex items-center justify-center space-x-1.5">
            <span>최종 결과 확인하기</span>
            <i class="fa-solid fa-flag-checkered"></i>
          </button>
        `;
      } else {
        html += `
          <button onclick="nextQuiz()" ${!hasAnswered ? 'disabled' : ''} class="w-2/3 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md disabled:opacity-40 disabled:pointer-events-none transition flex items-center justify-center space-x-1.5">
            <span>다음 문항</span>
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        `;
      }

      html += `</div></div>`;

      document.getElementById('quiz-card-container').innerHTML = html;
    }

    function handleOptionSelect(optionIndex) {
      if (selectedQuizAnswers[currentQuizIndex] !== undefined) return;
      selectedQuizAnswers[currentQuizIndex] = optionIndex;
      renderQuiz();
    }

    function prevQuiz() {
      if (currentQuizIndex > 0) {
        currentQuizIndex--;
        renderQuiz();
      }
    }

    function nextQuiz() {
      if (currentQuizIndex < quizQuestions.length - 1) {
        currentQuizIndex++;
        renderQuiz();
      }
    }

    function finishQuiz() {
      let score = 0;
      quizQuestions.forEach((q, idx) => {
        if (selectedQuizAnswers[idx] === q.correct) {
          score++;
        }
      });

      document.getElementById('quiz-final-score').textContent = `${score} / ${quizQuestions.length}`;
      const msg = document.getElementById('quiz-result-msg');
      const icon = document.getElementById('quiz-result-icon');

      if (score === quizQuestions.length) {
        msg.textContent = "완벽합니다! 2026 인플루엔자 대응 수칙을 완벽히 마스터하셨습니다.";
        icon.className = "w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner";
        icon.innerHTML = `<i class="fa-solid fa-crown text-amber-500"></i>`;
      } else if (score >= 3) {
        msg.textContent = "우수한 성적입니다! 학교 현장에서 침착하게 대응하실 수 있습니다.";
        icon.className = "w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner";
        icon.innerHTML = `<i class="fa-solid fa-award"></i>`;
      } else {
        msg.textContent = "수칙을 다시 한번 확인하고 재도전해 보세요!";
        icon.className = "w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner";
        icon.innerHTML = `<i class="fa-solid fa-rotate-right"></i>`;
      }

      document.getElementById('quiz-result-modal').classList.remove('hidden');
    }

    function closeQuizResultModal() {
      document.getElementById('quiz-result-modal').classList.add('hidden');
    }

    function restartQuiz() {
      selectedQuizAnswers = {};
      currentQuizIndex = 0;
      closeQuizResultModal();
      renderQuiz();
    }

    // App Initialization
    window.onload = function() {
      renderTraining();
    };
  </script>
</body>
</html>
