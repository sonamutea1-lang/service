    // 숫자가 역동적으로 부드럽게 올라가는 카운트업 커스텀 훅
    function useCountUp(targetValue, duration = 800) {
      const [count, setCount] = useState(0);
      const prevValueRef = useRef(0);

      useEffect(() => {
        let startTimestamp = null;
        const startVal = prevValueRef.current;
        const endVal = targetValue;
        const diff = endVal - startVal;

        if (diff === 0) return;

        const step = (timestamp) => {
          if (!startTimestamp) startTimestamp = timestamp;
          const progress = Math.min((timestamp - startTimestamp) / duration, 1);
          // Ease-out expo 가속도 수식
          const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
          const currentVal = Math.floor(startVal + diff * easeProgress);
          setCount(currentVal);

          if (progress < 1) {
            window.requestAnimationFrame(step);
          } else {
            prevValueRef.current = endVal;
            setCount(endVal);
          }
        };

        window.requestAnimationFrame(step);
      }, [targetValue, duration]);

      return count;
    }

              spread: 90,
              origin: { y: 0.6 }
            });

      }, 0);

          ...prev,
          [item.id]: (prev[item.id] || 0) + 1

        triggerConfetti(false);

        setCart(prev => {
          const current = prev[itemId] || 0;
          if (current <= 1) {
            const next = { ...prev };
            delete next[itemId];
            return next;
          }
          return { ...prev, [itemId]: current - 1 };
        });
      };

        setCart({});
      };

                </div>
              </div>

              {/* 예산 초과 경고 메시지 배너 */}
              {shakeWarning && (
                <div className="mt-4 bg-rose-100 border-2 border-rose-400 text-rose-800 px-4 py-3 rounded-2xl flex items-center gap-2 animate-pulse">
                  <span className="text-2xl">⚠️</span>
                  <div className="text-sm font-black">
                    앗! 남은 돈이 부족해요! 😭 기간을 더 길게 늘리거나 다른 신나는 아이템을 담아보세요!
                  </div>
                </div>
              )}
            </section>

            {}
            {/* 상품 리스트 & 우측 장바구니 결제창 */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
              {/* 왼쪽: 상품 목록 (2열 너비) */}
              <div className="lg:col-span-2 space-y-4">
                <div className="flex items-center justify-between px-1">
                  <h4 className="text-base md:text-lg font-black text-slate-700 flex items-center gap-1.5">
                    <span>🎁 사고 싶은 선물을 콕콕 눌러 담아보세요!</span>
                  </h4>
                  <span className="text-xs text-slate-500 font-bold">총 {BUCKET_ITEMS.length}개 꿈 아이템</span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {BUCKET_ITEMS.map((item) => {
                    const inCartQty = cart[item.id] || 0;
                    const canAfford = remainingMoney >= item.price;

                    return (
                      <div
                        key={item.id}
                        className={`bg-white rounded-3xl p-4 border-2 transition-all duration-200 relative flex flex-col justify-between shadow-sm hover:shadow-lg ${
                          inCartQty > 0 
                            ? 'border-sky-400 ring-2 ring-sky-200 bg-sky-50/40' 
                            : 'border-slate-200 hover:border-amber-300'
                        } ${!canAfford && inCartQty === 0 ? 'opacity-60 bg-slate-50' : ''}`}
                      >
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-[11px] font-extrabold bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full">
                            {item.category}
                          </span>
                          {inCartQty > 0 && (
                            <span className="bg-sky-500 text-white font-black text-xs px-2.5 py-0.5 rounded-full shadow-sm animate-pulse">
                              담김: {inCartQty}개
                            </span>
                          )}
                        </div>

                        <div className="flex items-start gap-3 my-1">
                          <span className="text-4xl p-2.5 bg-amber-50 rounded-2xl border border-amber-100 shrink-0 select-none">
                            {item.emoji}
                          </span>
                          <div className="flex-1">
                            <h5 className="font-black text-slate-800 text-base leading-tight">
                              {item.name}
                            </h5>
                            <p className="text-xs text-slate-500 mt-1 line-clamp-2">
                              {item.desc}
                            </p>
                          </div>
                        </div>

                        <div className="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
                          <div>
                            <span className="text-[11px] text-slate-400 block font-bold">가격</span>
                            <span className="font-black text-slate-900 text-base">
                              {formatKRW(item.price)}
                            </span>
                          </div>

                          <button
                            onClick={() => handleAddItem(item)}
                            className={`px-4 py-2 rounded-2xl font-black text-sm flex items-center gap-1 shadow-md transition-all active:scale-95 ${
                              canAfford
                                ? 'bg-amber-400 hover:bg-amber-500 text-amber-950 shadow-amber-200 cursor-pointer'
                                : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                            }`}
                          >
                            <span>+</span> 담기
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {}
              {/* 오른쪽: 장바구니 내역 & 완료 버튼 */}
              <div className="bg-white rounded-3xl p-5 md:p-6 shadow-xl border-4 border-indigo-200 sticky top-20">
                <div className="flex items-center justify-between pb-3 border-b-2 border-slate-100">
                  <h4 className="text-lg font-black text-slate-800 flex items-center gap-1.5">
                    <span>🛒</span> 나의 장바구니
                  </h4>
                  <span className="text-xs bg-indigo-100 text-indigo-800 font-extrabold px-2.5 py-1 rounded-full">
                    {Object.values(cart).reduce((a, b) => a + b, 0)}개 선택
                  </span>
                </div>

                {/* 담긴 물품 목록 */}
                <div className="my-4 max-h-72 overflow-y-auto pr-1 space-y-3 divide-y divide-slate-100">
                  {Object.keys(cart).length === 0 ? (
                    <div className="text-center py-10">
                      <span className="text-4xl block mb-2 select-none">🛍️</span>
                      <p className="text-slate-500 font-bold text-sm">
                        아직 담긴 꿈 아이템이 없어요!
                      </p>
                      <p className="text-xs text-slate-400 mt-1">
                        왼쪽에서 마음에 드는 선물을 골라 [담기]를 눌러보세요.
                      </p>
                    </div>
                  ) : (
                    Object.entries(cart).map(([id, qty]) => {
                      const item = BUCKET_ITEMS.find(i => i.id === id);
                      if (!item) return null;
                      return (
                        <div key={id} className="pt-3 flex items-center justify-between gap-2">
                          <div className="flex items-center gap-2 overflow-hidden">
                            <span className="text-xl shrink-0">{item.emoji}</span>
                            <div className="truncate">
                              <p className="text-xs font-black text-slate-800 truncate">
                                {item.name}
                              </p>
                              <p className="text-[11px] text-slate-500 font-semibold">
                                {formatKRW(item.price * qty)}
                              </p>
                            </div>
                          </div>

                          <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 shrink-0">
                            <button
                              onClick={() => handleRemoveOne(id)}
                              className="w-6 h-6 rounded-lg bg-white flex items-center justify-center text-slate-700 hover:bg-slate-200 shadow-xs font-bold text-xs"
                            >
                              -
                            </button>
                            <span className="w-5 text-center text-xs font-black text-slate-800">
                              {qty}
                            </span>
                            <button
                              onClick={() => handleAddItem(item)}
                              className="w-6 h-6 rounded-lg bg-white flex items-center justify-center text-slate-700 hover:bg-slate-200 shadow-xs font-bold text-xs"
                            >
                              +
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                {/* 금액 영수증 */}
                <div className="bg-indigo-50/80 rounded-2xl p-4 space-y-2 border border-indigo-100">
                  <div className="flex justify-between text-xs font-bold text-slate-600">
                    <span>총 절약한 돈</span>
                    <span>{formatKRW(totalSavedMoney)}</span>
                  </div>
                  <div className="flex justify-between text-xs font-bold text-indigo-700">
                    <span>장바구니 담은 금액</span>
                    <span>- {formatKRW(totalSpent)}</span>
                  </div>
                  <div className="border-t border-indigo-200 pt-2 flex justify-between text-sm font-black text-slate-800">
                    <span>남아있는 잔액</span>
                    <span className={remainingMoney < 0 ? 'text-rose-500' : 'text-emerald-600'}>
                      {formatKRW(remainingMoney)}
                    </span>
                  </div>
                </div>

                <button
                  disabled={Object.keys(cart).length === 0}
                  onClick={() => {
                    triggerConfetti(true);
                    setShowCertificate(true);
                  }}
                  className={`w-full mt-4 py-3.5 rounded-2xl font-black text-base flex items-center justify-center gap-2 shadow-lg transition-all transform active:scale-95 ${
                    Object.keys(cart).length > 0
                      ? 'bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white shadow-emerald-200 cursor-pointer animate-pulse'
                      : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                  }`}
                >
                  <span>🎉</span>
                  <span>내 꿈 쇼핑 완료 & 축하받기!</span>
                </button>
              </div>
            </div>

            {}
            {/* ③ 교육적 마무리 슬로건 카드 & 건강 비교 배지 */}
            <section className="bg-gradient-to-r from-sky-500 via-indigo-500 to-purple-600 rounded-3xl p-6 md:p-8 text-white shadow-2xl space-y-6">
              <div className="text-center max-w-2xl mx-auto space-y-3">
                <div className="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md px-4 py-1 rounded-full text-xs md:text-sm font-bold">
                  <span>🛡️ 선생님이 들려주는 노담 이야기</span>
                </div>

                <h3 className="text-2xl sm:text-3xl md:text-4xl font-black tracking-tight leading-snug">
                  "담배를 피우지 않는 것만으로도 건강뿐만 아니라 꿈을 이룰 수 있는 큰 돈을 모을 수 있어요!"
                </h3>

                <p className="text-sm md:text-base text-sky-100 font-medium leading-relaxed">
                  담배 연기 속에는 니코틴, 타르, 일산화탄소 등 4,000가지가 넘는 유해 물질이 들어있어요.
                  담배 대신 건강한 꿈과 행복을 저금통에 가득 채우는 멋진 어린이가 되어볼까요?
                </p>
              </div>

              {/* 3가지 비교 카드 */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                <div className="bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/20 text-center">
                  <div className="w-12 h-12 bg-white/20 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-2">
                    🏃‍♂️
                  </div>
                  <h5 className="font-black text-base text-yellow-300">튼튼한 심장과 폐</h5>
                  <p className="text-xs text-slate-100 mt-1">
                    담배를 피우지 않으면 운동장을 마음껏 뛰어도 숨이 덜 차고 언제나 활기차요!
                  </p>
                </div>

                <div className="bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/20 text-center">
                  <div className="w-12 h-12 bg-white/20 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-2">
                    💎
                  </div>
                  <h5 className="font-black text-base text-yellow-300">꿈을 이루는 종잣돈</h5>
                  <p className="text-xs text-slate-100 mt-1">
                    버려지는 담뱃돈 대신 멋진 게임기, 해외여행, 나만의 자동차와 집을 살 수 있어요.
                  </p>
                </div>

                <div className="bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/20 text-center">
                  <div className="w-12 h-12 bg-white/20 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-2">
                    🌿
                  </div>
                  <h5 className="font-black text-base text-yellow-300">상쾌한 숨과 가족 사랑</h5>
                  <p className="text-xs text-slate-100 mt-1">
                    옷과 입에서 불쾌한 냄새가 나지 않아 사랑하는 가족과 친구들이 아주 좋아해요!
                  </p>
                </div>
              </div>
            </section>

          </main>

          {}
          {/* 쇼핑 완료 축하 & 노담 다짐 서약서 팝업 모달 */}
          {showCertificate && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl border-4 border-yellow-300 relative text-center">
                <button
                  onClick={() => setShowCertificate(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-700 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center font-bold"
                >
                  ✕
                </button>

                <div className="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-3xl mx-auto flex items-center justify-center text-3xl shadow-inner mb-3">
                  🏆
                </div>

                <span className="bg-emerald-100 text-emerald-800 text-xs font-black px-3 py-1 rounded-full">
                  꿈 쇼핑 달성 인증서
                </span>

                <h3 className="text-2xl font-black text-slate-800 mt-2">
                  축하합니다! 멋진 꿈을 담았어요!
                </h3>

                <p className="text-sm text-slate-600 mt-1">
                  담배를 멀리한 덕분에 무려 <b className="text-sky-600 font-black">{formatKRW(totalSpent)}</b> 어치의
                  소중한 선물과 미래를 내 것으로 만들 수 있었습니다!
                </p>

                {/* 담은 물품 목록 */}
                <div className="bg-amber-50 rounded-2xl p-4 my-4 border border-amber-200 text-left max-h-40 overflow-y-auto">
                  <p className="text-xs font-bold text-amber-900 mb-2">내가 지켜낸 소중한 선물 목록:</p>
                  <div className="space-y-1">
                    {Object.entries(cart).map(([id, qty]) => {
                      const item = BUCKET_ITEMS.find(i => i.id === id);
                      if (!item) return null;
                      return (
                        <div key={id} className="text-xs font-black text-slate-700 flex justify-between">
                          <span>{item.emoji} {item.name}</span>
                          <span className="text-amber-800 font-extrabold">{qty}개</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 서약 섹션 */}
                <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 text-left space-y-2">
                  <label className="block text-xs font-bold text-slate-600">
                    내 이름으로 평생 노담(금연) 약속하기 ✍️
                  </label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="이름을 입력하세요 (예: 김건강)"
                      value={studentName}
                      onChange={(e) => setStudentName(e.target.value)}
                      className="flex-1 bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-sky-400"
                    />
                    <button
                      onClick={() => {
                        if (studentName.trim()) {
                          setHasPledged(true);
                          triggerConfetti(true);
                        }
                      }}
                      className="bg-sky-500 hover:bg-sky-600 text-white text-xs font-black px-4 py-2 rounded-xl shrink-0 transition-colors"
                    >
                      도장 쾅!
                    </button>
                  </div>

                  {hasPledged && (
                    <div className="mt-2 bg-emerald-100 text-emerald-800 text-xs font-black p-2.5 rounded-xl text-center flex items-center justify-center gap-1.5 animate-pulse">
                      <span>✨ {studentName} 어린이는 평생 건강과 꿈을 지키기로 굳게 약속했어요! 🌟</span>
                    </div>
                  )}
                </div>

                <button
                  onClick={() => setShowCertificate(false)}
                  className="mt-5 w-full bg-amber-400 hover:bg-amber-500 text-amber-950 font-black py-3 rounded-2xl text-sm transition-colors shadow-md"
                >
                  마켓으로 돌아가기
                </button>
              </div>
            </div>
          )}

          {/* 하단 푸터 */}
          <footer className="mt-12 text-center text-xs text-slate-400 font-medium">
            <p>🏫 초등학교 흡연예방 보건교육 인터랙티브 체험관</p>
            <p className="mt-0.5">건강한 숨, 빛나는 미래! 우리 모두 노담(No담배)을 실천해요 🌱</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
